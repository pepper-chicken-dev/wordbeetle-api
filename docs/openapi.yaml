openapi: 3.0.3
info:
  title: WordBeetle API
  description: Backend API for WordBeetle - a spaced-repetition vocabulary learning app
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development

paths:
  # ──────────────── Authentication ────────────────
  /api/v1/auth/guest:
    post:
      tags: [Auth]
      summary: Create a guest user
      description: Creates a temporary guest user (expires in 7 days) and returns a JWT token.
      responses:
        "201":
          description: Guest user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      guest_expires_at:
                        type: string
                        format: date-time
                        description: Expiration time for the guest user (7 days after creation)
                  token:
                    type: string
                    description: JWT token for subsequent requests (expires at guest_expires_at)

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Authenticate with Google
      description: |
        Verifies a Google ID token and finds or creates the user.
        Returns a JWT token for subsequent API requests.
        If the email is already registered with a different provider, returns 409 Conflict.

        **Guest migration:** When `guest_token` is provided in the request body,
        migrates the guest user's data (wordbooks, words, meanings, examples, settings)
        to the Google account. If the Google account already exists, guest data is merged
        into it; otherwise, the guest user record is converted in-place.
      security:
        - googleIdToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                guest_token:
                  type: string
                  description: JWT token of the guest user to migrate data from (optional)
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
                      avatar_url:
                        type: string
                        nullable: true
                  token:
                    type: string
                    description: JWT token for subsequent requests (expires in 30 days)
        "400":
          description: Authorization header missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered with another provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Guest migration failed (e.g., guest_token user is not a guest)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────── Wordbooks ────────────────
  /api/v1/wordbooks:
    get:
      tags: [Wordbooks]
      summary: List current user's wordbooks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wordbook"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Wordbooks]
      summary: Create a wordbook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordbook]
              properties:
                wordbook:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Wordbooks]
      summary: Get a wordbook
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Wordbooks]
      summary: Update a wordbook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordbook]
              properties:
                wordbook:
                  type: object
                  properties:
                    title:
                      type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Wordbooks]
      summary: Delete a wordbook
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Words ────────────────
  /api/v1/wordbooks/{wordbook_id}/words:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
    get:
      tags: [Words]
      summary: List words in a wordbook
      description: Returns words with their first meaning (by display_order) included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WordWithFirstMeaning"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Words]
      summary: Create a word with optional nested meanings and examples
      description: |
        Creates a word in the wordbook. Optionally accepts nested `meanings_attributes`
        (with `examples_attributes` inside each meaning) to create related records in a
        single atomic transaction. The response always includes `meanings` array with
        nested `examples`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word]
              properties:
                word:
                  type: object
                  required: [spelling]
                  properties:
                    spelling:
                      type: string
                    meanings_attributes:
                      type: array
                      description: Optional nested meanings to create with the word
                      items:
                        type: object
                        required: [definition, display_order]
                        properties:
                          definition:
                            type: string
                          display_order:
                            type: integer
                            minimum: 1
                          examples_attributes:
                            type: array
                            description: Optional nested examples to create with the meaning
                            items:
                              type: object
                              required: [sentence, translation, display_order]
                              properties:
                                sentence:
                                  type: string
                                translation:
                                  type: string
                                display_order:
                                  type: integer
                                  minimum: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordWithRelations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{wordbook_id}/words/{id}:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Words]
      summary: Get a word
      description: |
        Returns a word. Use the `include` query parameter to embed related resources.
        Without `include`, only the word fields are returned (backward compatible).
      security:
        - bearerAuth: []
      parameters:
        - name: include
          in: query
          required: false
          description: |
            Comma-separated list of relations to include. Allowed values: meanings, examples.
            When examples is specified, meanings are automatically included with nested examples.
          schema:
            type: string
            example: meanings,examples
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordWithRelations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Words]
      summary: Update a word with optional nested meanings and examples
      description: |
        Updates a word. Optionally accepts nested `meanings_attributes`
        (with `examples_attributes` inside each meaning) to update or create
        related records in a single atomic transaction.

        For each nested item, supplying `id` updates the existing record
        (only the fields you include are changed); omitting `id` creates a
        new record (all required fields must be provided).

        Deletion is not supported through nested attributes — use the
        dedicated `DELETE /meanings/{id}` and `DELETE /examples/{id}`
        endpoints instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word]
              properties:
                word:
                  type: object
                  properties:
                    spelling:
                      type: string
                    status:
                      $ref: "#/components/schemas/WordStatus"
                    meanings_attributes:
                      type: array
                      description: |
                        Nested meanings to update or create. Include `id` to update an
                        existing meaning; omit `id` to create a new one.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID of the existing meaning to update. Omit when creating a new meaning.
                          definition:
                            type: string
                          display_order:
                            type: integer
                            minimum: 1
                          examples_attributes:
                            type: array
                            description: |
                              Nested examples to update or create. Include `id` to update an
                              existing example; omit `id` to create a new one.
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID of the existing example to update. Omit when creating a new example.
                                sentence:
                                  type: string
                                translation:
                                  type: string
                                display_order:
                                  type: integer
                                  minimum: 1
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Words]
      summary: Delete a word
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Test Words ────────────────
  /api/v1/wordbooks/{wordbook_id}/test/words:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
    get:
      tags: [Test]
      summary: List reviewable words for test
      description: |
        Returns words that are due for review (next_review_at is null or in the past),
        with their meanings and examples eager-loaded. Designed for the test/quiz page.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWordsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Meanings ────────────────
  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
    get:
      tags: [Meanings]
      summary: List meanings for a word
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Meaning"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Meanings]
      summary: Create a meaning for a word
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meaning]
              properties:
                meaning:
                  type: object
                  required: [definition, display_order]
                  properties:
                    definition:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meaning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings/{id}:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Meanings]
      summary: Get a meaning
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meaning"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Meanings]
      summary: Update a meaning
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meaning]
              properties:
                meaning:
                  type: object
                  properties:
                    definition:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meaning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Meanings]
      summary: Delete a meaning
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Examples ────────────────
  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings/{meaning_id}/examples:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
      - $ref: "#/components/parameters/MeaningId"
    get:
      tags: [Examples]
      summary: List examples for a meaning
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Example"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Examples]
      summary: Create an example for a meaning
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example]
              properties:
                example:
                  type: object
                  required: [sentence, translation, display_order]
                  properties:
                    sentence:
                      type: string
                    translation:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings/{meaning_id}/examples/{id}:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
      - $ref: "#/components/parameters/MeaningId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Examples]
      summary: Get an example
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Examples]
      summary: Update an example
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example]
              properties:
                example:
                  type: object
                  properties:
                    sentence:
                      type: string
                    translation:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Examples]
      summary: Delete an example
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Setting (singular resource) ────────────────
  /api/v1/setting:
    get:
      tags: [Settings]
      summary: Get the current user's setting
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Settings]
      summary: Create a setting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting]
              properties:
                setting:
                  type: object
                  required: [hard_interval, uncertain_interval, easy_interval]
                  properties:
                    hard_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    uncertain_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    easy_interval:
                      $ref: "#/components/schemas/IntervalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    patch:
      tags: [Settings]
      summary: Update the setting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting]
              properties:
                setting:
                  type: object
                  properties:
                    hard_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    uncertain_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    easy_interval:
                      $ref: "#/components/schemas/IntervalInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Settings]
      summary: Delete the setting
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── User (singular resource) ────────────────
  /api/v1/user:
    delete:
      tags: [Users]
      summary: Delete the current user account
      description: |
        Permanently deletes the authenticated user and all associated data
        (wordbooks, words, meanings, examples, settings) via cascading deletes.
        The JWT token is not revoked server-side, but subsequent requests with
        the orphaned token will return 401.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      description: Google ID token passed as Bearer token in Authorization header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/guest or /api/v1/auth/google

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WordbookId:
      name: wordbook_id
      in: path
      required: true
      schema:
        type: integer
    WordId:
      name: word_id
      in: path
      required: true
      schema:
        type: integer
    MeaningId:
      name: meaning_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of items per page (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not owned by current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Required parameter missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error (production only)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ──── Models ────
    Wordbook:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        created_at:
          type: string
          format: date-time

    Word:
      type: object
      properties:
        id:
          type: integer
        spelling:
          type: string
        status:
          $ref: "#/components/schemas/WordStatus"
        next_review_at:
          type: string
          format: date-time
          nullable: true

    WordWithFirstMeaning:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            first_meaning:
              nullable: true
              description: The meaning with the lowest display_order, or null if no meanings exist
              type: object
              properties:
                definition:
                  type: string

    WordWithRelations:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            meanings:
              type: array
              description: Present when include=meanings or include=examples is specified
              items:
                $ref: "#/components/schemas/MeaningWithExamples"

    TestWordsResponse:
      type: object
      properties:
        wordbook:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
        words:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Word"
              - type: object
                properties:
                  meanings:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeaningWithExamples"

    WordStatus:
      type: string
      enum: [not_studied, hard, uncertain, easy]

    Meaning:
      type: object
      properties:
        id:
          type: integer
        definition:
          type: string
        display_order:
          type: integer
          minimum: 1

    MeaningWithExamples:
      allOf:
        - $ref: "#/components/schemas/Meaning"
        - type: object
          properties:
            examples:
              type: array
              description: Present when include=examples is specified
              items:
                $ref: "#/components/schemas/Example"

    Example:
      type: object
      properties:
        id:
          type: integer
        sentence:
          type: string
        translation:
          type: string
        display_order:
          type: integer
          minimum: 1

    Setting:
      type: object
      description: |
        Interval fields are returned as {days, hours, minutes} objects
        (converted from PostgreSQL interval internally).
      properties:
        hard_interval:
          $ref: "#/components/schemas/IntervalOutput"
        uncertain_interval:
          $ref: "#/components/schemas/IntervalOutput"
        easy_interval:
          $ref: "#/components/schemas/IntervalOutput"

    IntervalInput:
      type: object
      description: Duration expressed as days/hours/minutes
      properties:
        days:
          type: integer
          default: 0
        hours:
          type: integer
          default: 0
        minutes:
          type: integer
          default: 0

    IntervalOutput:
      type: object
      nullable: true
      properties:
        days:
          type: integer
        hours:
          type: integer
        minutes:
          type: integer

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer

    # ──── Error responses ────
    Error:
      type: object
      properties:
        error:
          type: string

    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
