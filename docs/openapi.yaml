openapi: 3.0.3
info:
  title: WordBeetle API
  description: Backend API for WordBeetle - a spaced-repetition vocabulary learning app
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development

paths:
  # ──────────────── Authentication ────────────────
  /api/v1/auth/guest:
    post:
      tags: [Auth]
      summary: Create a guest user
      description: Creates a temporary guest user (expires in 7 days) and returns a JWT token.
      responses:
        "201":
          description: Guest user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      guest_expires_at:
                        type: string
                        format: date-time
                        description: Expiration time for the guest user (7 days after creation)
                  token:
                    type: string
                    description: JWT token for subsequent requests (expires at guest_expires_at)

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Authenticate with Google
      description: |
        Verifies a Google ID token and finds or creates the user.
        Returns a JWT token for subsequent API requests.
        If the email is already registered with a different provider, returns 409 Conflict.

        **Guest migration:** When `guest_token` is provided in the request body,
        migrates the guest user's data (wordbooks, words, meanings, examples, settings)
        to the Google account. If the Google account already exists, guest data is merged
        into it; otherwise, the guest user record is converted in-place.
      security:
        - googleIdToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                guest_token:
                  type: string
                  description: JWT token of the guest user to migrate data from (optional)
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
                      avatar_url:
                        type: string
                        nullable: true
                  token:
                    type: string
                    description: JWT token for subsequent requests (expires in 30 days)
        "400":
          description: Authorization header missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered with another provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Guest migration failed (e.g., guest_token user is not a guest)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────── Wordbooks ────────────────
  /api/v1/wordbooks:
    get:
      tags: [Wordbooks]
      summary: List current user's wordbooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wordbook"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Wordbooks]
      summary: Create a wordbook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordbook]
              properties:
                wordbook:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Wordbooks]
      summary: Get a wordbook
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Wordbooks]
      summary: Update a wordbook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordbook]
              properties:
                wordbook:
                  type: object
                  properties:
                    title:
                      type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wordbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Wordbooks]
      summary: Delete a wordbook
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

