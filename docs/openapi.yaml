        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Examples ────────────────
  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/examples:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
    get:
      tags: [Examples]
      summary: List examples for a word
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Example"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Examples]
      summary: Create an example for a word
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example]
              properties:
                example:
                  type: object
                  required: [sentence, translation, display_order]
                  properties:
                    sentence:
                      type: string
                    translation:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/examples/{id}:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Examples]
      summary: Get an example
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Examples]
      summary: Update an example
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example]
              properties:
                example:
                  type: object
                  properties:
                    sentence:
                      type: string
                    translation:
                      type: string
                    display_order:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Examples]
      summary: Delete an example
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Setting (singular resource) ────────────────
  /api/v1/setting:
    get:
      tags: [Settings]
      summary: Get the current user's setting
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Settings]
      summary: Create a setting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting]
              properties:
                setting:
                  type: object
                  required: [hard_interval, uncertain_interval, easy_interval]
                  properties:
                    hard_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    uncertain_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    easy_interval:
                      $ref: "#/components/schemas/IntervalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    patch:
      tags: [Settings]
      summary: Update the setting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting]
              properties:
                setting:
                  type: object
                  properties:
                    hard_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    uncertain_interval:
                      $ref: "#/components/schemas/IntervalInput"
                    easy_interval:
                      $ref: "#/components/schemas/IntervalInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Settings]
      summary: Delete the setting
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      description: Google ID token passed as Bearer token in Authorization header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/guest or /api/v1/auth/google

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WordbookId:
      name: wordbook_id
      in: path
      required: true
      schema:
        type: integer
    WordId:
      name: word_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not owned by current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Required parameter missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error (production only)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ──── Models ────
    User:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [google, guest]
        provider_uid:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        guest_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Present only for guest users (expires 7 days after creation)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Wordbook:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Word:
      type: object
      properties:
        id:
          type: integer
        wordbook_id:
          type: integer
        spelling:
          type: string
        status:
          $ref: "#/components/schemas/WordStatus"
        next_review_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WordStatus:
      type: string
      enum: [not_studied, hard, uncertain, easy]

    Meaning:
      type: object
      properties:
        id:
          type: integer
        word_id:
          type: integer
        content:
          type: string
        display_order:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Example:
      type: object
      properties:
        id:
          type: integer
        word_id:
          type: integer
        sentence:
          type: string
        translation:
          type: string
        display_order:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Setting:
      type: object
      description: |
        Interval fields are returned as {days, hours, minutes} objects
        (converted from PostgreSQL interval internally).
      properties:
        id:
          type: integer
        user_id:
          type: integer
        hard_interval:
          $ref: "#/components/schemas/IntervalOutput"
        uncertain_interval:
          $ref: "#/components/schemas/IntervalOutput"
        easy_interval:
          $ref: "#/components/schemas/IntervalOutput"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IntervalInput:
      type: object
      description: Duration expressed as days/hours/minutes
      properties:
        days:
          type: integer
          default: 0
        hours:
          type: integer
          default: 0
        minutes:
          type: integer
          default: 0

    IntervalOutput:
      type: object
      nullable: true
      properties:
        days:
          type: integer
        hours:
          type: integer
        minutes:
          type: integer

    # ──── Error responses ────
    Error:
      type: object
      properties:
        error:
          type: string

    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
