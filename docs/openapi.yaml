        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Words]
      summary: Delete a word
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────── Meanings ────────────────
  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
    get:
      tags: [Meanings]
      summary: List meanings for a word
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meaning"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Meanings]
      summary: Create a meaning for a word
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meaning]
              properties:
                meaning:
                  type: object
                  required: [content, display_order]
                  properties:
                    content:
