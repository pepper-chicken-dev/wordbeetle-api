    post:
      tags: [Words]
      summary: Create a word in a wordbook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word]
              properties:
                word:
                  type: object
                  required: [spelling, status]
                  properties:
                    spelling:
                      type: string
                    status:
                      $ref: "#/components/schemas/WordStatus"
                    next_review_at:
                      type: string
                      format: date-time
                      nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
