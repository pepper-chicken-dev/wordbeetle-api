        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      tags: [Meanings]
      summary: Delete a meaning
      security:
        - bearerAuth: []
      responses:
