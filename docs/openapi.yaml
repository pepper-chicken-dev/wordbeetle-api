  /api/v1/wordbooks/{wordbook_id}/words/{word_id}/meanings/{id}:
    parameters:
      - $ref: "#/components/parameters/WordbookId"
      - $ref: "#/components/parameters/WordId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Meanings]
      summary: Get a meaning
      security:
        - bearerAuth: []
      responses:
        "200":
