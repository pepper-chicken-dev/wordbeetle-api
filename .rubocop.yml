plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "node_modules/**/*"

# Metrics - disabled to avoid noisy false positives
Metrics:
  Enabled: false

# Naming - disabled to avoid noisy false positives
Naming:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# RSpec cops - relax strict defaults
RSpec/MultipleExpectations:
  Max: 10

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleMemoizedHelpers:
  Max: 10

RSpec/NestedGroups:
  Max: 5

RSpec/LetSetup:
  Enabled: false

# Migrations - exclude from bulk change and squished SQL checks
Rails/BulkChangeTable:
  Exclude:
    - "db/migrate/**/*"

Rails/SquishedSQLHeredocs:
  Exclude:
    - "db/migrate/**/*"

Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_token
